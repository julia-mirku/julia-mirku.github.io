<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page not found | Julia Mirku</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#2B4272">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#2B4272;--coral-deep:#284175;--bg:#F7F9FC;--line:#E4E9F2;--ink:#202733;--muted:#5A6472;--act:#FA826E;--act-deep:#E76A54}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Poppins',system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column}
a{color:inherit;text-decoration:none}
.wrap{max-width:1120px;margin:0 auto;padding:0 22px;width:100%}
header{background:rgba(247,249,252,.90);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;height:66px}
.brand{font-weight:700;font-size:1.15rem;color:var(--navy);letter-spacing:-.02em;display:inline-flex;align-items:center;min-height:44px}
.brand b{color:var(--act)}
main{flex:1;display:flex;align-items:center;padding:60px 0}
.eyebrow{font-size:.78rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--coral-deep)}
h1{font-size:clamp(2.1rem,5.6vw,3.35rem);font-weight:700;color:var(--navy);line-height:1.15;letter-spacing:-.01em;margin:.5rem 0 .9rem}
p{color:var(--muted);margin-bottom:1.7rem;max-width:560px}
.btn{display:inline-flex;align-items:center;min-height:44px;font-weight:600;font-size:1rem;padding:.85rem 1.5rem;border-radius:999px;background:var(--act);color:#fff;box-shadow:0 12px 26px -12px rgba(250,130,110,.75);transition:transform .15s ease,background .2s ease}
.btn:hover{background:var(--act-deep);transform:translateY(-2px)}
:focus-visible{outline:3px solid #365496;outline-offset:2px;border-radius:4px}
</style>
</head>
<body>
<header><div class="wrap nav"><a class="brand" href="/"><b>Julia</b>&nbsp;Mirku</a></div></header>
<main>
  <div class="wrap">
    <span class="eyebrow">404</span>
    <h1>Page not found</h1>
    <p>This page doesn't exist or has moved.</p>
    <a class="btn" href="/">Back to the home page</a>
  </div>
</main>
</body>
</html>
